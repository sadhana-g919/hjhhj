<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - AI Learning Assistant
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>

<body>

    <div class="page">

        <header class="hero">

            <div class="badge">
                AI Learning Assistant
            </div>

            <h1>
                EduGenie
            </h1>

            <p>
                Your smart AI-powered learning companion
            </p>

            <p class="subtitle">
                Ask questions, understand concepts,
                summarize notes, generate quizzes,
                and create personalized learning paths.
            </p>

        </header>


        <main class="card">

            <label for="task">
                Choose what you want EduGenie to do
            </label>

            <select id="task">

                <option value="qa">
                    Question & Answer
                </option>

                <option value="explain">
                    Explain a Topic
                </option>

                <option value="quiz">
                    Generate Quiz
                </option>

                <option value="summarize">
                    Summarize Notes
                </option>

                <option value="recommend">
                    Learning Path
                </option>

            </select>


            <label for="inputText">
                Enter your content
            </label>

            <textarea
                id="inputText"
                rows="10"
                placeholder="Example: Explain normalization in DBMS."
            ></textarea>


            <button id="submitBtn">
                Generate
            </button>


            <div
                id="status"
                class="status"
                hidden
            ></div>


            <section
                id="result"
                class="result"
                hidden
            ></section>

        </main>


        <footer>

            <p>
                EduGenie • Powered by Generative AI
            </p>

        </footer>

    </div>


    <script
        src="{{ url_for('static', path='app.js') }}"
    ></script>

</body>

</html>
